name: Deploy M&F GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "M&F/site/**"
      - "M&F/worker.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare Worker source for Pages
        run: |
          cp "M&F/worker.js" "M&F/site/worker.js"
          python3 - <<'PY'
          from pathlib import Path
          import base64
          worker = Path("M&F/worker.js").read_bytes()
          page_path = Path("M&F/site/index.html")
          page = page_path.read_text(encoding="utf-8")
          marker = "__WORKER_SOURCE_BASE64__"
          if page.count(marker) < 1:
              raise SystemExit("Worker source placeholder was not found in deployer page.")
          encoded = base64.b64encode(worker).decode("ascii")
          page_path.write_text(page.replace(marker, encoded, 1), encoding="utf-8")
          print(f"Embedded Worker source into deployer page ({len(worker)} bytes).")
          page_path.with_name("deployer-c8c1ffb.html").write_text(page_path.read_text(encoding="utf-8"), encoding="utf-8")
          print("Created cache-busted deployer-c8c1ffb.html.")
          PY
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: M&F/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published Worker URL
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          SITE_URL="${SITE_URL%/}"
          echo "Checking ${SITE_URL}/worker.js"
          curl --fail --location --retry 8 --retry-delay 5 --retry-all-errors \
            --output /tmp/published-worker.js \
            --write-out "HTTP %{http_code}\n" \
            "${SITE_URL}/worker.js"
          test -s /tmp/published-worker.js
          echo "Worker asset is publicly reachable and non-empty."
          curl --fail --location --retry 8 --retry-delay 5 --retry-all-errors --output /tmp/deployer.html "${SITE_URL}/deployer-c8c1ffb.html"
          if grep -Fq "const EMBEDDED_WORKER_BASE64='__WORKER_SOURCE_BASE64__'" /tmp/deployer.html; then
            echo "Versioned deployer page still contains the unfilled Worker placeholder."
            exit 1
          fi
          grep -Fq "const EMBEDDED_WORKER_BASE64='" /tmp/deployer.html
          echo "Versioned deployer page contains embedded Worker source."
