name: Deploy M&F GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "M&F/site/**"
      - "M&F/worker.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare Worker source for Pages
        run: |
          mkdir -p "M&F/site/M&F"
          cp "M&F/worker.js" "M&F/site/worker.js"
          cp "M&F/worker.js" "M&F/site/M&F/worker.js"
          test -s "M&F/site/worker.js"
          test -s "M&F/site/M&F/worker.js"
          test -s "M&F/site/index.html"
          echo "Worker asset and deployer page are ready for Pages."
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: M&F/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published Worker URL
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          SITE_URL="${SITE_URL%/}"
          echo "Checking ${SITE_URL}/M%26F/worker.js"
          curl --fail --location --retry 8 --retry-delay 5 --retry-all-errors \
            --output /tmp/published-worker.js \
            --write-out "HTTP %{http_code}\n" \
            "${SITE_URL}/M%26F/worker.js"
          test -s /tmp/published-worker.js
          echo "Worker asset is publicly reachable at the configured path."
          curl --fail --location --retry 8 --retry-delay 5 --retry-all-errors --output /tmp/deployer.html "${SITE_URL}/"
          grep -Fq "const WORKER_SOURCE_URL=new URL('M%26F/worker.js',location.href)" /tmp/deployer.html
          echo "Canonical deployer page points to the published M%26F/worker.js asset."
