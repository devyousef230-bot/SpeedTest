<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PePeruny ⚡ Speed Test</title>
<style>
:root{
--bg:#05070c;
--card:rgba(255,255,255,.065);
--input:rgba(0,0,0,.32);
--line:#00ffbf;
--line2:#00aaff;
--text:#fff;
--muted:#65716d;
--glow:rgba(0,255,191,.16);
--danger:#ff405f;
--warn:#ffc247;
}
*{box-sizing:border-box}
body{
background:var(--bg);
color:var(--text);
font-family:Arial,sans-serif;
overflow-x:hidden;
padding:18px 10px 35px;
position:relative;
transition:background .4s,color .4s;
}

body:before{
content:"";
position:fixed;
inset:0;
z-index:-5;
background:
linear-gradient(var(--glow) 1px,transparent 1px),
linear-gradient(90deg,var(--glow) 1px,transparent 1px);
background-size:35px 35px;
mask-image:linear-gradient(to bottom,#000,transparent 90%);
}

body:after{
content:"";
position:fixed;
width:480px;
height:480px;
border-radius:50%;
background:var(--line);
filter:blur(150px);
opacity:.09;
top:-240px;
left:-170px;
z-index:-4;
animation:orb 8s infinite alternate ease-in-out;
}
.orb2{
position:fixed;width:300px;height:300px;border-radius:50%;
background:var(--line2);filter:blur(130px);opacity:.055;
right:-150px;bottom:-80px;z-index:-7;animation:orb 10s infinite alternate-reverse ease-in-out;
}
.particles{position:fixed;inset:0;z-index:-6;pointer-events:none;overflow:hidden}
.particle{
position:absolute;width:2px;height:2px;background:var(--line);border-radius:50%;
box-shadow:0 0 8px var(--line);opacity:.5;animation:float linear infinite;
}
header{
display:flex;justify-content:center;align-items:center;gap:8px;
font-size:27px;text-shadow:0 0 10px var(--line),0 0 10px var(--glow);
}
.bname{color:var(--text)}
.how{color:var(--line);font-style:italic}
.versionN{
background:var(--line);border-radius:6px;font-size:11px;
min-width:48px;height:19px;justify-content:center;align-items:center;
display:flex;margin-right:4px;color:var(--bg);font-weight:bold;
}
.caption{
width:100%;display:flex;align-items:center;justify-content:center;
text-align:center;color:var(--line);font-size:13px;letter-spacing:.3px;
border:1px dashed var(--line);border-radius:10px;background:var(--glow);
margin:20px 0 10px;padding:13px 8px;
box-shadow:0 0 18px rgba(0,255,191,.04);
}
.connection{
width:max-content;max-width:100%;margin:10px auto 0;
display:flex;align-items:center;gap:7px;padding:6px 12px;
border:1px solid rgba(0,255,191,.25);border-radius:999px;
background:rgba(0,255,191,.035);font-size:11px;color:#b5fff0;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);box-shadow:0 0 9px var(--line);animation:blink 1.2s infinite}
.testS{
width:100%;height:390px;display:flex;justify-content:center;align-items:center;
position:relative;
margin: 30px 0;
}
.circle{
position:relative;width:350px;height:350px;
background:radial-gradient(circle,rgba(0,255,191,.12),rgba(0,255,191,.035) 45%,transparent 70%);
border-radius:50%;border:2px dashed rgba(0,255,191,.65);
display:flex;justify-content:center;align-items:center;
box-shadow:inset 0 0 45px rgba(0,255,191,.05),0 0 35px rgba(0,255,191,.06);
margin: 60px 0;
}
.circle:before{
content:"";position:absolute;inset:18px;border-radius:50%;
border:1px solid rgba(0,255,191,.13);
box-shadow:0 0 20px rgba(0,255,191,.06);
}
.circle:after{
content:"";position:absolute;inset:-9px;border-radius:50%;
border:5px solid transparent;border-top-color:var(--line);border-right-color:rgba(0,255,191,.15);
filter:drop-shadow(0 0 8px var(--line)) drop-shadow(0 0 15px var(--glow));
animation:spinGlow 1.8s linear infinite;
}
.ring2{
position:absolute;inset:-22px;border-radius:50%;
border:1px solid rgba(0,170,255,.16);
border-left-color:var(--line2);
animation:spinGlow 7s linear infinite reverse;
}
.tick{
position:absolute;inset:-1px;border-radius:50%;
background:repeating-conic-gradient(from 0deg,rgba(0,255,191,.7) 0deg 1deg,transparent 1deg 10deg);
-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
opacity:.45;
}
.scan{
position:absolute;width:50%;height:2px;right:50%;top:50%;
transform-origin:right center;
background:linear-gradient(90deg,transparent,var(--line));
filter:drop-shadow(0 0 7px var(--line));
opacity:.55;animation:scan 2.5s linear infinite;
}
.scan:after{
content:"";position:absolute;right:0;top:-3px;width:8px;height:8px;border-radius:50%;
background:var(--line);box-shadow:0 0 12px var(--line);
}
.center{position:relative;z-index:2;text-align:center;direction:ltr}
.speed{color:var(--line);font-size:20px;text-shadow:0 0 10px var(--line)}
.speed a{font-size:56px;font-weight:800;letter-spacing:-2px}
.unit{font-size:13px;color:#a7cfc5;letter-spacing:3px;margin-top:2px}
.phase{font-size:10px;color:var(--muted);margin-top:9px;letter-spacing:1.5px;text-transform:uppercase}
.needle{
position:absolute;width:128px;height:3px;left:50%;top:50%;
transform-origin:0 50%;transform:translateY(-50%) rotate(-135deg);
background:linear-gradient(90deg,var(--line),transparent);
filter:drop-shadow(0 0 5px var(--line));z-index:1;transition:transform .35s ease-out;
}
.needle:before{
content:"";position:absolute;left:-5px;top:-4px;width:11px;height:11px;border-radius:50%;
background:var(--line);box-shadow:0 0 12px var(--line);
}
.box{
width:96%;margin:0 auto;border-radius:12px;border:1px dashed var(--line);
min-height:200px;padding:0 0 15px;background:var(--glow);
box-shadow:0 0 25px rgba(0,255,191,.04);
}
.flex{display:flex;gap:10px;padding:0 2.5%}
.Latency,.download{
width:50%;height:92px;margin-top:18px;border:1px solid rgba(0,255,191,.15);
border-radius:9px;box-shadow:0 0 9px rgba(0,255,191,.12);
background:var(--bg);display:flex;flex-direction:column;justify-content:center;
align-items:center;color:var(--line);font-size:14px;direction:ltr;
}
.statTitle{font-size:10px;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:1px}
.statValue{font-size:21px;font-weight:bold}
button{
font-size:17px;width:95%;margin:15px 2.5% 0;background:var(--bg);height:55px;
border:1px solid var(--line);color:var(--line);border-radius:8px;
box-shadow:0 0 8px rgba(0,255,191,.35),inset 0 0 10px rgba(0,255,191,.03);
cursor:pointer;transition:.2s;position:relative;overflow:hidden;
}
button:hover{box-shadow:0 0 18px rgba(0,255,191,.5),inset 0 0 15px rgba(0,255,191,.07);transform:translateY(-1px)}
button:active{transform:scale(.985)}
button:disabled{opacity:.55;cursor:not-allowed}
button:before{
content:"";position:absolute;top:0;left:-100%;width:70%;height:100%;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);
transform:skewX(-20deg);animation:buttonShine 3s infinite;
}
.status{
color:var(--line);text-align:center;margin-top:11px;min-height:18px;
font-size:12px;text-shadow:0 0 5px var(--line),0 0 8px var(--glow);
}
.graphCard{
width:96%;margin:15px auto 0;padding:12px 12px 8px;
border:1px solid rgba(0,255,191,.14);border-radius:10px;background:rgba(0,0,0,.18);
}
.graphHead{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted);direction:ltr}
.graphHead b{color:var(--line);font-size:12px}
canvas{width:100%;height:80px;display:block;margin-top:5px}
.result{
width:96%;margin:15px auto 0;border-radius:12px;padding:16px;
border:1px solid rgba(0,255,191,.18);background:rgba(255,255,255,.035);
display:none;direction:ltr;
}
.result.show{display:block;animation:appear .5s ease}
.resultTitle{text-align:center;color:var(--line);font-size:12px;letter-spacing:2px}
.resultMain{text-align:center;font-size:30px;font-weight:bold;margin:8px 0}
.resultMain small{font-size:12px;color:var(--muted)}
.resultGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rItem{border:1px solid rgba(255,255,255,.07);border-radius:8px;padding:10px;text-align:center;background:rgba(0,0,0,.2)}
.rItem span{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}
.rItem b{font-size:15px;color:#fff}
.history{
width:96%;margin:15px auto 0;display:none;
}
.history.show{display:block}
.historyTitle{color:var(--line);font-size:12px;margin-bottom:7px}
.historyRow{
display:flex;justify-content:space-between;direction:ltr;
padding:9px 10px;margin-bottom:5px;border-radius:7px;
background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05);
font-size:11px;color:#b6c5c1;
}
.historyRow b{color:var(--line)}
.shake{animation:shake .35s}
body.testing .circle{box-shadow:inset 0 0 60px rgba(0,255,191,.1),0 0 45px rgba(0,255,191,.15)}
body.testing .scan{animation-duration:1.2s}
@keyframes spinGlow{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes scan{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes orb{to{transform:translate(130px,90px) scale(1.15)}}
@keyframes blink{50%{opacity:.25;transform:scale(.75)}}
@keyframes buttonShine{0%,55%{left:-100%}75%,100%{left:140%}}
@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes float{from{transform:translateY(110vh);opacity:0}15%{opacity:.5}90%{opacity:.3}to{transform:translateY(-10vh);opacity:0}}
@media(max-width:500px){
header{font-size:20px;gap:5px}.versionN{font-size:9px;min-width:42px;height:17px}
.circle{width:310px;height:310px}.testS{height:350px}.needle{width:110px}
.speed a{font-size:50px}.box{width:97%}.flex{gap:7px;padding:0 2%}
.Latency,.download{width:50%}.graphCard,.result,.history{width:97%}
}
</style>
</head>
<body>
<div class="orb2"></div><div class="particles" id="particles"></div>

<header>
<span class="bname">⚡ PePeruny</span>
<span class="how">→ Speed Test</span>
<span class="versionN">v 1.0.0</span>
</header>

<div class="caption">تست کیفیت اتصال و سرعت دانلود و پینگ ⚡</div>

<div class="connection"><span class="dot"></span><span> CLOUDFLARE EDGE • READY</span></div>

<section class="testS">
<div class="circle">
<div class="ring2"></div>
<div class="tick"></div>
<div class="scan"></div>
<div class="needle" id="needle"></div>
<div class="center">
<div class="speed"><a id="speed">0.0</a></div>
<div class="unit">Mbps</div>
<div class="phase" id="phase">READY TO TEST</div>
</div>
</div>
</section>

<section class="box">
<div class="flex">
<div class="Latency">
<div class="statTitle">Latency</div>
<div class="statValue"><span id="ping">—</span> <small>ms</small></div>
</div>
<div class="download">
<div class="statTitle">Download</div>
<div class="statValue"><span id="download">—</span> <small>Mbps</small></div>
</div>
</div>
<button id="start">⚡ شروع تست</button>
</section>

<div class="status" id="status">Ready</div>

<div class="graphCard">
<div class="graphHead"><span>LIVE DOWNLOAD</span><b id="live">0.0 Mbps</b></div>
<canvas id="graph"></canvas>
</div>

<div class="result" id="result">
<div class="resultTitle">TEST COMPLETE</div>
<div class="resultMain"><span id="resultSpeed">0.0</span> <small>Mbps</small></div>
<div class="resultGrid">
<div class="rItem"><span>LATENCY</span><b id="resultPing">— ms</b></div>
<div class="rItem"><span>PEAK</span><b id="resultPeak">— Mbps</b></div>
</div>
</div>

<div class="history" id="history">
<div class="historyTitle">LAST TESTS</div>
<div id="historyList"></div>
</div>

<script>
const start=document.getElementById("start");
const speed=document.getElementById("speed");
const ping=document.getElementById("ping");
const download=document.getElementById("download");
const status=document.getElementById("status");
const phase=document.getElementById("phase");
const needle=document.getElementById("needle");
const live=document.getElementById("live");
const result=document.getElementById("result");
const graph=document.getElementById("graph");
const ctx=graph.getContext("2d");
let points=[],peak=0;

for(let i=0;i<28;i++){
const p=document.createElement("i");p.className="particle";
p.style.left=Math.random()*100+"%";p.style.animationDuration=(7+Math.random()*13)+"s";
p.style.animationDelay=(-Math.random()*15)+"s";document.getElementById("particles").appendChild(p);
}

function resizeCanvas(){
const dpr=devicePixelRatio||1;
const r=graph.getBoundingClientRect();
graph.width=r.width*dpr;graph.height=r.height*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
drawGraph();
}
addEventListener("resize",resizeCanvas);

function drawGraph(){
const w=graph.clientWidth,h=graph.clientHeight;
ctx.clearRect(0,0,w,h);
ctx.strokeStyle="rgba(0,255,191,.07)";ctx.lineWidth=1;
for(let y=10;y<h;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
if(points.length<2)return;
const max=Math.max(100,peak*1.15);
ctx.beginPath();
points.forEach((v,i)=>{
const x=i*(w/(Math.max(points.length-1,1)));
const y=h-8-(v/max)*(h-16);
i?ctx.lineTo(x,y):ctx.moveTo(x,y);
});
ctx.strokeStyle="#00ffbf";ctx.lineWidth=2;ctx.shadowBlur=8;ctx.shadowColor="#00ffbf";ctx.stroke();ctx.shadowBlur=0;
}

function setNeedle(v){
const max=1000;
const ratio=Math.min(v,max)/max;
needle.style.transform=`translateY(-50%) rotate(${-135+ratio*270}deg)`;
}

function addPoint(v){
points.push(v);if(points.length>55)points.shift();peak=Math.max(peak,v);
live.textContent=v.toFixed(1)+" Mbps";drawGraph();setNeedle(v);
}

async function testPing(){
const url="https://www.cloudflare.com/cdn-cgi/trace?x="+Math.random();
const t=performance.now();
await fetch(url,{cache:"no-store",mode:"cors"});
return Math.round(performance.now()-t);
}

async function testDownload(){
const url="https://speed.cloudflare.com/__down?bytes=15000000&x="+Math.random();
const t=performance.now();
const response=await fetch(url,{cache:"no-store"});
if(!response.body)throw new Error("Streaming unavailable");
const reader=response.body.getReader();
let total=0;
while(true){
const {done,value}=await reader.read();
if(done)break;
total+=value.length;
const elapsed=performance.now()-t;
if(elapsed>100){
const current=(total*8/elapsed)/1000;
speed.textContent=current.toFixed(1);addPoint(current);
}
}
const elapsed=performance.now()-t;
return(total*8/elapsed)/1000;
}

function saveHistory(sp,pn,pk){
let h=JSON.parse(localStorage.getItem("peperunySpeedHistory")||"[]");
h.unshift({speed:sp,ping:pn,peak:pk,time:new Date().toLocaleTimeString("fa-IR",{hour:"2-digit",minute:"2-digit"})});
localStorage.setItem("peperunySpeedHistory",JSON.stringify(h.slice(0,5)));
renderHistory();
}
function renderHistory(){
const h=JSON.parse(localStorage.getItem("peperunySpeedHistory")||"[]");
const box=document.getElementById("history"),list=document.getElementById("historyList");
if(!h.length){box.classList.remove("show");return}
box.classList.add("show");
list.innerHTML=h.map(x=>`<div class="historyRow"><b>${x.speed} Mbps</b><span>${x.ping} ms</span><span>peak ${x.peak} Mbps</span><span>${x.time}</span></div>`).join("");
}

start.onclick=async()=>{
start.disabled=true;document.body.classList.add("testing");
result.classList.remove("show");points=[];peak=0;drawGraph();
speed.textContent="0.0";ping.textContent="—";download.textContent="—";live.textContent="0.0 Mbps";setNeedle(0);
try{
phase.textContent="MEASURING LATENCY";status.textContent="Testing latency...";
const latency=await testPing();ping.textContent=latency;
phase.textContent="DOWNLOADING";status.textContent="Testing download speed...";
const finalSpeed=await testDownload();
const rounded=Number(finalSpeed.toFixed(1));
speed.textContent=rounded.toFixed(1);download.textContent=rounded.toFixed(1);
addPoint(rounded);
phase.textContent="TEST COMPLETE";status.textContent="✓ Test complete";
document.getElementById("resultSpeed").textContent=rounded.toFixed(1);
document.getElementById("resultPing").textContent=latency+" ms";
document.getElementById("resultPeak").textContent=peak.toFixed(1)+" Mbps";
result.classList.add("show");
saveHistory(rounded,latency,Number(peak.toFixed(1)));
}catch(error){
console.error(error);phase.textContent="TEST FAILED";status.textContent="Test failed — connection error";
speed.textContent="—";start.classList.add("shake");setTimeout(()=>start.classList.remove("shake"),400);
}finally{
document.body.classList.remove("testing");start.disabled=false;
}
};

renderHistory();setTimeout(resizeCanvas,50);
</script>
</body>
</html>
